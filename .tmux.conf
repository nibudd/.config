# make a symlink of this file in your home directory with
# ln -s ~/.config/.tmux.conf ~/.tmux.conf

# KEY BINDINGS
# vi-style navigation bindings for copy mode
set-window-option -g mode-keys vi

# v: starts selection in copy mode
bind-key -T copy-mode-vi v send -X begin-selection

# V: selects entire line in copy mode
bind-key -T copy-mode-vi V send -X select-line

# prefix+/: regex search back through scrollback; n/N cycle matches. Searches
# backward because copy-mode opens at the bottom, where forward finds nothing.
bind-key / copy-mode \; command-prompt -p "search up:" "send-keys -X search-backward '%%'"

# PLUGINS
# tmux plugin manager
set -g @plugin 'tmux-plugins/tpm'

# some sensible defaults
set -g @plugin 'tmux-plugins/tmux-sensible'

# seamless navigation between vim and tmux
set -g @plugin 'christoomey/vim-tmux-navigator'

# convenient copy/paste bindings
# y: yanks selection
# prefix+y: copy command line
# Y: copy and paste to command line
# prefix+Y: copy cwd
set -g @plugin 'tmux-plugins/tmux-yank'

# vimium-style hint labels over everything matchable in the pane.
# prefix+F: label every match, then
#   <label>: copy   <c-label>: open   <s-label>: copy and paste   tab: multi-select
# Built-in patterns cover urls, paths, git-status files, diffs, SHAs, ips, digits,
# uuids, hex and kubernetes ids -- a superset of the old tmux-copycat searches.
# Replaces tmux-copycat, deprecated upstream at tmux 2.4, which rewrapped 13 copy-mode
# bindings in run-shell: that broke mouse wheel-down and forked a shell on every yank.
# Installed via brew rather than tpm, whose install path needs an interactive wizard.
run '/opt/homebrew/bin/tmux-fingers load-config'

# open selected files and URLs
# o: open file in default app/browser
# <c-o>: open file in default $EDITOR
set -g @plugin 'tmux-plugins/tmux-open'
set -g @open-editor-command '/opt/homebrew/bin/nvim' # set nvim as the editor

# saves and restores an entire session
# save: prefix+<c-s>; restore: prefix+<c-r>
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-nvim 'session' # include nvim sessions

# auto-save/restore sessions and auto-start tmux
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on' # auto-restore last saved session on tmux start

# Mouse on, with native (fork-free) wheel handling. Wheel goes straight to apps that
# own the mouse (Claude, nvim, fzf); a plain shell scrolls tmux history via copy-mode;
# pagers arrow-scroll. Replaces tmux-mighty-scroll, whose per-notch ps/pgrep fork is
# slow on macOS (its compiled C fast-path is Linux/proc-only).
set -g mouse on
bind -T root WheelUpPane   if -F -t= "#{?pane_in_mode,1,#{mouse_any_flag}}" "send -M" "if -F -t= '#{alternate_on}' 'send -N3 Up' 'copy-mode -et='"
bind -T root WheelDownPane if -F -t= "#{?pane_in_mode,1,#{mouse_any_flag}}" "send -M" "if -F -t= '#{alternate_on}' 'send -N3 Down' 'send -M'"

# Smoother shell-history scrolling: 2 lines per wheel notch (tmux default is 5).
# Scrolling to the bottom exits copy-mode so the prompt comes back automatically.
bind -T copy-mode    WheelUpPane   select-pane -t "{mouse}" \; send-keys -X -N2 -t "{mouse}" scroll-up
bind -T copy-mode    WheelDownPane select-pane -t "{mouse}" \; send-keys -X -N2 -t "{mouse}" scroll-down \; if-shell -F -t "{mouse}" "#{&&:#{pane_in_mode},#{==:#{scroll_position},0}}" { send-keys -X -t "{mouse}" cancel }
bind -T copy-mode-vi WheelUpPane   select-pane -t "{mouse}" \; send-keys -X -N2 -t "{mouse}" scroll-up
bind -T copy-mode-vi WheelDownPane select-pane -t "{mouse}" \; send-keys -X -N2 -t "{mouse}" scroll-down \; if-shell -F -t "{mouse}" "#{&&:#{pane_in_mode},#{==:#{scroll_position},0}}" { send-keys -X -t "{mouse}" cancel }

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
